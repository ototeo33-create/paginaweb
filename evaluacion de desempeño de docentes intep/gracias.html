<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! - INTEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green: #059669;
            --green-light: #10B981;
            --green-dark: #047857;
            --green-pale: #ECFDF5;
            --purple: #4A1942;
            --purple-mid: #6B3FA0;
            --purple-light: #9B6FCF;
            --purple-pale: #f3ecf8;
            --cream: #F5F2EC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thanks-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .thanks-modal.show {
            display: flex;
        }

        .thanks-content {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.4s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .thanks-icon {
            width: 100px;
            height: 100px;
            background: var(--green-pale);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .thanks-icon i {
            font-size: 50px;
            color: var(--green);
        }

        .thanks-content h2 {
            color: var(--purple);
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .thanks-content p {
            color: var(--text-mid);
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .thanks-message {
            font-size: 0.95em !important;
            line-height: 1.6;
            margin-top: 15px !important;
            padding: 15px;
            background: var(--green-pale);
            border-radius: 10px;
            color: var(--green-dark) !important;
            font-weight: 500;
        }

        .thanks-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Exo 2', sans-serif;
        }

        .btn-success {
            background: var(--green);
            color: white;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }

        .btn-success:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e5e5e5;
            color: var(--purple);
        }

        .btn-secondary:hover {
            background: #d4d4d4;
        }

        .thanks-buttons .btn {
            flex: 1;
            min-width: 150px;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .thanks-content {
                padding: 40px 25px;
            }
            .thanks-content h2 {
                font-size: 1.5em;
            }
            .thanks-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="thanks-modal show">
        <div class="thanks-content">
            <div class="thanks-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>¡Gracias por tu participación!</h2>
            <p>Tu evaluación ha sido guardada exitosamente.</p>
            <p class="thanks-message">Tu opinión es muy valiosa para mejorar la calidad educativa en el INTEP. Con tu granito de arena, estamos construyendo un mejor ambiente de aprendizaje para todos.</p>
            <div class="thanks-buttons">
                <button class="btn btn-success" onclick="window.location.href='index.html'">
                    <i class="fas fa-redo"></i> Nueva Evaluación
                </button>
                <button class="btn btn-secondary" onclick="window.close()">
                    <i class="fas fa-home"></i> Cerrar
                </button>
            </div>
        </div>
    </div>
</body>
</html>
