<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Matrículas INTEP - Ingresa tu PIN</title>

  <link rel="stylesheet" href="css/style.css">

<body class="pin-page">

  <!-- Decoraciones sutiles -->
  <div class="pin-decor d1"><i class="fas fa-graduation-cap"></i></div>
  <div class="pin-decor d2"><i class="fas fa-book-open"></i></div>
  <div class="pin-decor d3"><i class="fas fa-star"></i></div>
  <div class="pin-decor d4"><i class="fas fa-award"></i></div>

  <div class="pin-card">
    <div class="logo-ring">
      <img src="../logointep.png" alt="INTEP" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\' style=\'font-size:2.5rem;color:var(--primary);\'></i>';">
    </div>

    <h1>Bienvenido a INTEP</h1>
    <p class="subtitle">Instituto Técnico Empresarial y Profesional</p>

    <div class="pin-input-wrap">
      <i class="fas fa-key pin-icon"></i>
      <input type="text" id="pinInput" placeholder="Ingresa tu PIN" maxlength="10" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <button class="btn-pin" id="btnIngresar">
      <span id="btnPinText">Ingresar al formulario</span>
      <div id="pinLoader" class="pin-loader"></div>
    </button>

    <p id="pinError" class="pin-error"></p>

    <p class="pin-footer-text">
      <i class="fas fa-shield-alt"></i> PIN seguro enviado por WhatsApp
    </p>

    <div class="pin-device-tip">
      <i class="fas fa-laptop"></i>
      <span>Para una mejor experiencia, te recomendamos completar el formulario desde un computador. Desde tu celular también puedes hacerlo sin problema.</span>
    </div>
  </div>

  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
