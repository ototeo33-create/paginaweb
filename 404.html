<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — INTEP Madrid</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--green:#059669;--purple:#4A1942;--cream:#F5F2EC;--text:#2D2235}
body{font-family:'Exo 2',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.logo-wrap{margin-bottom:2rem}
.logo-wrap img{height:70px;margin:0 auto}
.code{font-size:6rem;font-weight:800;color:var(--purple);opacity:.15;line-height:1}
.title{font-size:1.6rem;font-weight:800;color:var(--purple);margin-bottom:.5rem}
.subtitle{color:#5A4D66;margin-bottom:2rem;max-width:420px;line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:999px;font-family:'Exo 2',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;transition:.2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#047857}
.btn-outline{border:2px solid var(--purple);color:var(--purple)}
.btn-outline:hover{background:var(--purple);color:#fff}
</style>
</head>
<body>
  <div class="logo-wrap">
    <img src="/logointep.png" alt="INTEP">
  </div>
  <div class="code">404</div>
  <h1 class="title">Página no encontrada</h1>
  <p class="subtitle">La dirección que buscas no existe o fue movida. Visita nuestras páginas principales:</p>
  <div class="links">
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Inicio</a>
    <a href="/#programas" class="btn btn-outline"><i class="fas fa-book-open"></i> Programas</a>
    <a href="/nosotros.html" class="btn btn-outline"><i class="fas fa-users"></i> Quiénes Somos</a>
    <a href="/empresas.html" class="btn btn-outline"><i class="fas fa-briefcase"></i> Empresas</a>
  </div>
</body>
</html>
