<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Módulo 6 - Actions 🏃‍♂️ | INTEP Kids</title>
    <script>window.__CURSO={nivel:'kids',examen:6};</script>
    <script>
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('demo') === '1') {
        window.__INTEP = {ok: true, nombre: 'Demo'};
    } else {
    (function(){
      fetch('/intep/cursoingles/api/sesion.php',{credentials:'include'})
        .then(function(r){return r.json();})
        .then(function(d){if(!d.ok)window.location.replace('/intep/login.php');window.__INTEP=d;})
        .catch(function(){window.location.replace('/intep/login.php');});
    })();
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#FF5A5F;--secondary:#08C2A8;--accent:#FFD166;--bg-color:#F8FDFF;--text-dark:#2D3142;--text-light:#4F5D75;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Nunito',sans-serif;background:var(--bg-color);color:var(--text-dark);}
        h1,h2,h3,h4{font-family:'Fredoka',sans-serif;}
        .exam-container{max-width:800px;margin:0 auto;padding:2rem 5%;}
        .exam-header{background:linear-gradient(135deg,#fff9e6,#fff0f0);border-radius:25px;padding:2rem;text-align:center;border:3px solid var(--accent);margin-bottom:2rem;}
        .exam-header h1{font-size:2rem;color:var(--text-dark);margin-bottom:10px;}
        .exam-header p{color:var(--text-light);font-size:1.1rem;}
        .question-card{background:white;border-radius:20px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 5px 15px rgba(0,0,0,0.05);}
        .q-number{background:var(--primary);color:white;padding:5px 15px;border-radius:15px;font-size:0.9rem;font-weight:700;display:inline-block;margin-bottom:15px;}
        .q-text{font-family:'Fredoka',sans-serif;font-size:1.3rem;margin-bottom:1rem;}
        .q-image{font-size:3rem;text-align:center;margin:15px 0;}
        .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        @media(max-width:500px){.options-grid{grid-template-columns:1fr;}}
        .option-btn{padding:15px;border-radius:15px;border:3px solid #e5e7eb;background:white;font-family:'Fredoka',sans-serif;font-size:1.1rem;cursor:pointer;transition:all 0.2s;text-align:center;}
        .option-btn:hover{border-color:var(--secondary);background:#f0fdfb;}
        .option-btn.selected{border-color:var(--secondary);background:#f0fdfb;}
        .option-btn.correct{border-color:#22c55e;background:#f0fdf4;color:#15803d;}
        .option-btn.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626;}
        .btn-submit{display:block;width:100%;padding:18px;margin-top:2rem;background:linear-gradient(135deg,var(--primary),#ff8a8e);color:white;border:none;border-radius:20px;font-family:'Fredoka',sans-serif;font-size:1.4rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(255,90,95,0.4);}
        .btn-submit:hover{transform:translateY(-3px);}
        .result-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(45,49,66,0.9);z-index:1000;justify-content:center;align-items:center;}
        .result-box{background:white;border-radius:30px;padding:3rem;text-align:center;max-width:400px;width:90%;animation:popIn 0.5s;}
        @keyframes popIn{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
        .result-icon{font-size:5rem;}
        .result-title{font-family:'Fredoka',sans-serif;font-size:2rem;margin:15px 0;}
        .result-score{font-size:1.2rem;color:var(--text-light);margin-bottom:20px;}
        .result-buttons{display:flex;flex-direction:column;gap:10px;}
        .btn-retry{width:100%;padding:15px;border-radius:15px;border:3px solid var(--primary);background:white;color:var(--primary);font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;}
        .btn-retry:hover{background:var(--primary);color:white;}
        .btn-pass{width:100%;padding:15px;border-radius:15px;border:none;background:var(--secondary);color:white;font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;}
        .btn-pass:hover{background:#06a085;}
    </style>
</head>
<body>
    <div class="exam-container">
        <div class="exam-header">
            <h1>🏃‍♂️ Examen: Acciones</h1>
            <p>Responde las preguntas para demostrar lo que aprendiste</p>
        </div>
        
        <div id="questions"></div>
        <button class="btn-submit" onclick="submitExam()">📝 Terminar Examen</button>
    </div>

    <div id="resultModal" class="result-overlay">
        <div class="result-box">
            <div class="result-icon" id="resultIcon">🏆</div>
            <h2 class="result-title" id="resultTitle">¡Excelente!</h2>
            <p class="result-score" id="resultScore">Puntaje: 8/10</p>
            <div class="result-buttons" id="resultButtons"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/intep/cursoingles/cursos_api.js"></script>
    <script>
        var examVersion = 2;
        var questions = [
            {q:'¿Cómo se dice "correr" en inglés?',img:'🏃‍♂️',options:[{t:'Run',c:true},{t:'Jump',c:false},{t:'Walk',c:false},{t:'Sleep',c:false}]},
            {q:'¿Cuál es la acción "jump"?',img:'🤸‍♂️',options:[{t:'Saltar',c:true},{t:'Correr',c:false},{t:'Comer',c:false},{t:'Dormir',c:false}]},
            {q:'Selecciona el "eat":',img:'🍎',options:[{t:'Comer',c:true},{t:'Beber',c:false},{t:'Correr',c:false},{t:'Saltar',c:false}]},
            {q:'¿Cómo se dice "dormir" en inglés?',img:'😴',options:[{t:'Sleep',c:true},{t:'Run',c:false},{t:'Eat',c:false},{t:'Drink',c:false}]},
            {q:'¿Qué acción es "drink"?',img:'🥤',options:[{t:'Beber',c:true},{t:'Comer',c:false},{t:'Correr',c:false},{t:'Saltar',c:false}]},
            {q:'Selecciona el "write":',img:'✍️',options:[{t:'Escribir',c:true},{t:'Leer',c:false},{t:'Cantar',c:false},{t:'Bailar',c:false}]},
            {q:'Completa: "I can ___."',img:'🏃‍♂️',options:[{t:'run',c:true},{t:'big',c:false},{t:'blue',c:false},{t:'happy',c:false}]},
            {q:'Completa: "My brother can ___."',img:'🤸‍♂️',options:[{t:'jump',c:true},{t:'sleep',c:false},{t:'red',c:false},{t:'cold',c:false}]},
            {q:'¿Cómo se dice "I can run"?',img:'🏃‍♂️',options:[{t:'Yo puedo correr',c:true},{t:'Yo soy rápido',c:false},{t:'Mi hermano corre',c:false},{t:'Me gusta correr',c:false}]},
            {q:'¿Qué acción es "climb"?',img:'🧗‍♂️',options:[{t:'Trepar',c:true},{t:'Correr',c:false},{t:'Saltar',c:false},{t:'Dormir',c:false}]},
            {q:'¿Cómo podemos hacer que los niños aprendan acciones de forma divertida? 🎭',img:'🎮',options:[{t:'Usar el juego "Simón dice" con comandos en inglés',c:true},{t:'Enseñar conjugaciones verbales complejas',c:false},{t:'Hacer dictados de verbos en inglés',c:false},{t:'Explicar reglas gramaticales con textos largos',c:false}]},
            {q:'¿Qué juego es más divertido para practicar acciones con niños pequeños? 🎪',img:'🎲',options:[{t:'Simón dice (Simon says) con gestos y mímica',c:true},{t:'Copiar verbos en el cuaderno 10 veces',c:false},{t:'Ver documentales sobre deportes',c:false},{t:'Memorizar listas de verbos en orden alfabético',c:false}]}
        ];
        
        var userAnswers = {};
        var currentQuestions = [];
        
        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }
        
        function init() {
            currentQuestions = shuffleArray([...questions]).slice(0,7);
            var container = document.getElementById('questions');
            container.innerHTML = '';
            currentQuestions.forEach(function(q, idx) {
                var shuffledOpts = shuffleArray([...q.options]);
                var card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = '<div class="q-number">Pregunta ' + (idx+1) + '</div><div class="q-image">' + q.img + '</div><div class="q-text">' + q.q + '</div><div class="options-grid" id="q' + idx + '"></div>';
                container.appendChild(card);
                var optsContainer = card.querySelector('#q' + idx);
                shuffledOpts.forEach(function(opt, oi) {
                    var btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.t;
                    btn.onclick = function() { selectOption(idx, oi, opt.c); };
                    optsContainer.appendChild(btn);
                });
            });
        }
        
        function selectOption(qIdx, oIdx, correct) {
            var container = document.getElementById('q' + qIdx);
            var buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(function(b, i) {
                if (i === oIdx) {
                    b.classList.add('selected');
                    userAnswers[qIdx] = correct;
                } else {
                    b.classList.remove('selected');
                }
            });
        }
        
        function submitExam() {
            var score = 0;
            var total = currentQuestions.length;
            for (var key in userAnswers) { if (userAnswers[key]) score++; }
            var passed = score >= 5;
            var pct = Math.round((score/total)*100);

            // Guardar progreso una sola vez
            window.INTEP_guardarProgreso({
                nivel:'kids', num:6, examen:true,
                porcentaje:pct, aprobado:passed,
                completado:passed, xp_ganado: passed ? 15 : 0,
                exam_version:examVersion
            });

            var modal = document.getElementById('resultModal');
            var icon = document.getElementById('resultIcon');
            var title = document.getElementById('resultTitle');
            var scoreText = document.getElementById('resultScore');
            var btns = document.getElementById('resultButtons');
            modal.style.display = 'flex';
            scoreText.innerText = 'Puntaje: ' + score + '/' + total;

            if (passed) {
                icon.innerText = '🏃‍♂️🏆';
                title.innerText = '¡Aprobado!';
                title.style.color = '#22c55e';
                btns.innerHTML = '<a class="btn-pass" href="/intep/cursoingles/cursoinglespreescolar/dashboard.php">🚀 ¡Siguiente Módulo!</a>';
                confetti({particleCount:150,spread:70,origin:{y:0.6},colors:['#22c55e','#FFD166','#FF5A5F']});
            } else {
                icon.innerText = '🏃‍♂️💪';
                title.innerText = '¡Casi lo logras!';
                title.style.color = '#ef4444';
                btns.innerHTML = '<button class="btn-retry" onclick="location.reload();">🔄 Repetir Examen</button><p style="margin-top:10px;color:#6b7280;font-size:0.9rem;">Necesitas 5 o más respuestas correctas</p>';
            }
        }
        
        init();
    </script>
</body>
</html>
