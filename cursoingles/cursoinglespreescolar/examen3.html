<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Módulo 3 - Números 🔢 | INTEP Kids</title>
    <script>window.__CURSO={nivel:'kids',examen:3};</script>
    <script>
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('demo') === '1') {
        window.__INTEP = {ok: true, nombre: 'Demo'};
    } else {
    (function(){
      fetch('/intep/cursoingles/api/sesion.php',{credentials:'include'})
        .then(function(r){return r.json();})
        .then(function(d){if(!d.ok)window.location.replace('/intep/login.php');window.__INTEP=d;})
        .catch(function(){window.location.replace('/intep/login.php');});
    })();
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#FF5A5F;--secondary:#08C2A8;--accent:#FFD166;--bg-color:#F8FDFF;--text-dark:#2D3142;--text-light:#4F5D75;--white:#FFFFFF;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Nunito',sans-serif;background:var(--bg-color);color:var(--text-dark);}
        h1,h2,h3,h4{font-family:'Fredoka',sans-serif;}
        .exam-container{max-width:800px;margin:0 auto;padding:2rem 5%;}
        .exam-header{background:linear-gradient(135deg,#f0e6ff,#e6f0ff);border-radius:25px;padding:2rem;text-align:center;border:3px solid #a855f7;margin-bottom:2rem;}
        .exam-header h1{font-size:2rem;color:var(--text-dark);margin-bottom:10px;}
        .exam-header p{color:var(--text-light);font-size:1.1rem;}
        .question-card{background:white;border-radius:20px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 5px 15px rgba(0,0,0,0.05);}
        .q-number{background:#a855f7;color:white;padding:5px 15px;border-radius:15px;font-size:0.9rem;font-weight:700;display:inline-block;margin-bottom:15px;}
        .q-text{font-family:'Fredoka',sans-serif;font-size:1.3rem;margin-bottom:1rem;}
        .q-image{font-size:3rem;text-align:center;margin:15px 0;}
        .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        @media(max-width:500px){.options-grid{grid-template-columns:1fr;}}
        .option-btn{padding:15px;border-radius:15px;border:3px solid #e5e7eb;background:white;font-family:'Fredoka',sans-serif;font-size:1.1rem;cursor:pointer;transition:all 0.2s;text-align:center;}
        .option-btn:hover{border-color:#a855f7;background:#f5f3ff;}
        .option-btn.selected{border-color:#a855f7;background:#f5f3ff;}
        .btn-submit{display:block;width:100%;padding:18px;margin-top:2rem;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;border-radius:20px;font-family:'Fredoka',sans-serif;font-size:1.4rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,0.4);}
        .btn-submit:hover{transform:translateY(-3px);}
        .result-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(45,49,66,0.9);z-index:1000;justify-content:center;align-items:center;}
        .result-box{background:white;border-radius:30px;padding:3rem;text-align:center;max-width:400px;width:90%;animation:popIn 0.5s;}
        @keyframes popIn{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
        .result-icon{font-size:5rem;}
        .result-title{font-family:'Fredoka',sans-serif;font-size:2rem;margin:15px 0;}
        .result-score{font-size:1.2rem;color:var(--text-light);margin-bottom:20px;}
        .btn-retry{width:100%;padding:15px;border-radius:15px;border:3px solid var(--primary);background:white;color:var(--primary);font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
        .btn-retry:hover{background:var(--primary);color:white;}
        .btn-pass{width:100%;padding:15px;border-radius:15px;border:none;background:#7c3aed;color:white;font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;cursor:pointer;}
    </style>
</head>
<body>
    <div class="exam-container">
        <div class="exam-header">
            <h1>🔢 Examen: Números del 1 al 10</h1>
            <p>Responde las preguntas para demostrar lo que aprendiste</p>
        </div>
        <div id="questions"></div>
        <button class="btn-submit" onclick="submitExam()">📝 Terminar Examen</button>
    </div>
    <div id="resultModal" class="result-overlay">
        <div class="result-box">
            <div class="result-icon" id="resultIcon">🏆</div>
            <h2 class="result-title" id="resultTitle">¡Excelente!</h2>
            <p class="result-score" id="resultScore">Puntaje: 8/10</p>
            <div class="result-buttons" id="resultButtons"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/intep/cursoingles/cursos_api.js"></script>
    <script>
        var examVersion = 1;
        var questions = [
            {q:'¿Cómo se dice "uno" en inglés?',img:'1️⃣',options:[{t:'One',c:true},{t:'Two',c:false},{t:'Three',c:false},{t:'Four',c:false}]},
            {q:'Selecciona "two":',img:'✌️',options:[{t:'One',c:false},{t:'Two',c:true},{t:'Three',c:false},{t:'Four',c:false}]},
            {q:'¿Qué número es "three"?',img:'3️⃣',options:[{t:'Uno',c:false},{t:'Dos',c:false},{t:'Tres',c:true},{t:'Cuatro',c:false}]},
            {q:'Selecciona "four":',img:'4️⃣',options:[{t:'Three',c:false},{t:'Four',c:true},{t:'Five',c:false},{t:'Six',c:false}]},
            {q:'¿Cómo se dice "cinco" en inglés?',img:'5️⃣',options:[{t:'Four',c:false},{t:'Five',c:true},{t:'Six',c:false},{t:'Seven',c:false}]},
            {q:'Selecciona "six":',img:'🎲',options:[{t:'Five',c:false},{t:'Six',c:true},{t:'Seven',c:false},{t:'Eight',c:false}]},
            {q:'¿Qué número es "seven"?',img:'7️⃣',options:[{t:'Seis',c:false},{t:'Siete',c:true},{t:'Ocho',c:false},{t:'Nueve',c:false}]},
            {q:'Selecciona "eight":',img:'🐙',options:[{t:'Six',c:false},{t:'Seven',c:false},{t:'Eight',c:true},{t:'Nine',c:false}]},
            {q:'¿Cómo se dice "nueve" en inglés?',img:'9️⃣',options:[{t:'Seven',c:false},{t:'Eight',c:false},{t:'Nine',c:true},{t:'Ten',c:false}]},
            {q:'Selecciona "ten":',img:'🎉',options:[{t:'Eight',c:false},{t:'Nine',c:false},{t:'Ten',c:true},{t:'One',c:false}]}
        ];
        var userAnswers = {};
        var currentQuestions = [];
        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }
        function init() {
            currentQuestions = shuffleArray([...questions]).slice(0,7);
            var container = document.getElementById('questions');
            container.innerHTML = '';
            currentQuestions.forEach(function(q, idx) {
                var shuffledOpts = shuffleArray([...q.options]);
                var card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = '<div class="q-number">Pregunta ' + (idx+1) + '</div><div class="q-image">' + q.img + '</div><div class="q-text">' + q.q + '</div><div class="options-grid" id="q' + idx + '"></div>';
                container.appendChild(card);
                var optsContainer = card.querySelector('#q' + idx);
                shuffledOpts.forEach(function(opt, oi) {
                    var btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.t;
                    btn.onclick = function() { selectOption(idx, oi, opt.c); };
                    optsContainer.appendChild(btn);
                });
            });
        }
        function selectOption(qIdx, oIdx, correct) {
            var container = document.getElementById('q' + qIdx);
            var buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(function(b, i) {
                if (i === oIdx) {
                    b.classList.add('selected');
                    userAnswers[qIdx] = correct;
                } else {
                    b.classList.remove('selected');
                }
            });
        }
        function submitExam() {
            var score = 0;
            var total = currentQuestions.length;
            for (var key in userAnswers) {
                if (userAnswers[key]) score++;
            }
            var passed = score >= 5;
            var modal = document.getElementById('resultModal');
            var icon = document.getElementById('resultIcon');
            var title = document.getElementById('resultTitle');
            var scoreText = document.getElementById('resultScore');
            var btns = document.getElementById('resultButtons');
            modal.style.display = 'flex';
            scoreText.innerText = 'Puntaje: ' + score + '/' + total;
            if (passed) {
                icon.innerText = '🏆';
                title.innerText = '¡Aprobado!';
                title.style.color = '#22c55e';
                btns.innerHTML = '<button class="btn-pass" onclick="window.INTEP_guardarProgreso({nivel:\'kids\',num:3,examen:true,porcentaje:' + Math.round((score/total)*100) + ',completado:true,xp_ganado:15}); window.location.href=\'/intep/cursoingles/cursoinglespreescolar/dashboard.php\';">Continuar al siguiente módulo 🚀</button>';
                confetti({particleCount:150,spread:70,origin:{y:0.6},colors:['#a855f7','#7c3aed','#FFD166']});
            } else {
                icon.innerText = '📚';
                title.innerText = 'Intenta de nuevo';
                title.style.color = '#ef4444';
                btns.innerHTML = '<button class="btn-retry" onclick="location.reload();">Repetir Examen 📝</button>';
            }
            window.INTEP_guardarProgreso({nivel:'kids',num:3,examen:true,porcentaje:Math.round((score/total)*100),aprobado:passed,exam_version:examVersion});
        }
        init();
    </script>
</body>
</html>
