                { es: "equipaje", en: "luggage", emoji: "🧳", distractors: [{ en: "backpack", emoji: "🎒" }, { en: "bag", emoji: "👜" }] },

                { es: "cadena", en: "chain", emoji: "⛓️", distractors: [{ en: "rope", emoji: "🪢" }, { en: "lock", emoji: "🔒" }] },
                { es: "extintor", en: "extinguisher", emoji: "🧯", distractors: [{ en: "fire", emoji: "🔥" }, { en: "smoke", emoji: "💨" }] },
                { es: "volcán", en: "volcano", emoji: "🌋", distractors: [{ en: "mountain", emoji: "⛰️" }, { en: "fire", emoji: "🔥" }] },
                { es: "imán", en: "magnet", emoji: "🧲", distractors: [{ en: "metal", emoji: "🪙" }, { en: "electricity", emoji: "⚡" }] },
                { es: "tijeras", en: "scissors", emoji: "✂️", distractors: [{ en: "knife", emoji: "🔪" }, { en: "paper", emoji: "📄" }] },
                { es: "muleta", en: "crutch", emoji: "🩼", distractors: [{ en: "wheelchair", emoji: "♿" }, { en: "leg", emoji: "🦵" }] }
            ]
        };

        // Progression System
        let totalWins = parseInt(localStorage.getItem('lingua_visual_wins')) || 0;
        let pChallenge = 1;
        let cName = "Fácil";

        if (totalWins >= 3 && totalWins < 8) {
            pChallenge = 2; cName = "Intermedio";
        } else if (totalWins >= 8) {
            pChallenge = 3; cName = "Avanzado 👽";
        }

        document.getElementById('levelDisplay').innerText = `Sesiones: ${totalWins} | Categoría: ${cName}`;

        // Get 5 random questions for this session based on difficulty
        const sessionLevels = [...vocabPool[pChallenge]].sort(() => Math.random() - 0.5).slice(0, 5);

        let currentLevel = 0;
        let lives = 5;
        let gameState = 'playing'; // playing, checked-correct, checked-incorrect
        let selectedIndex = -1;
        let targetIndex = -1;

        const questionText = document.getElementById('questionText');
        const cardsGrid = document.getElementById('cardsGrid');
        const actionBtn = document.getElementById('actionBtn');
        const skipBtn = document.getElementById('skipBtn');
        const btnGroupLeft = document.getElementById('btnGroupLeft');
        const footerBar = document.getElementById('footerBar');
        const footerMsg = document.getElementById('footerMsg');
        const progressBar = document.getElementById('progressBar');
        const livesDisplay = document.getElementById('livesDisplay');

        // Sounds engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        function playTap() { playTone(500, 'sine', 0.1); }
        function playCorrect() { playTone(600, 'sine', 0.1); setTimeout(()=>playTone(800, 'sine', 0.2), 100); }
        function playIncorrect() { playTone(150, 'sawtooth', 0.3); }

        function initLevel() {
            gameState = 'playing';
            selectedIndex = -1;
            targetIndex = -1;
            
            footerBar.className = 'footer-bar';
            footerMsg.style.display = 'none';
            btnGroupLeft.style.display = 'block';
            actionBtn.className = 'check-btn';
            actionBtn.innerText = 'COMPROBAR';
            actionBtn.disabled = true;
            
            progressBar.style.width = ((currentLevel) / sessionLevels.length) * 100 + '%';
            
            const levelData = sessionLevels[currentLevel];
            questionText.innerText = `¿Cuál de estos es "${levelData.es}"?`;

            // Mix correct option with distractors
            let options = [...levelData.distractors];
            options.push({ en: levelData.en, emoji: levelData.emoji, isCorrect: true });
            options.sort(() => Math.random() - 0.5);

            cardsGrid.innerHTML = '';
            cardsGrid.classList.remove('shake-anim');

            options.forEach((opt, index) => {
                if (opt.isCorrect) targetIndex = index;
                
                const card = document.createElement('div');
                card.className = 'choice-card';
                card.id = `card-${index}`;
                card.onclick = () => handleSelect(index);
                
                card.innerHTML = `
                    <div class="card-emoji">${opt.emoji}</div>
                    <div class="card-label">${opt.en}</div>
                    <div class="card-hotkey">${index + 1}</div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        function handleSelect(index) {
            if (gameState !== 'playing') return;
            playTap();
            
            // Remove previous selection
            document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
            
            selectedIndex = index;
            document.getElementById(`card-${index}`).classList.add('selected');
            
            actionBtn.classList.add('active');
            actionBtn.disabled = false;
        }

        function handleSkip() {
            if (gameState !== 'playing') return;
            playIncorrect();
            lives--;
            livesDisplay.innerText = '❤️ ' + lives;
            
            showResult(false, "Saltaste la pregunta.");
        }

        actionBtn.onclick = () => {
            if (gameState === 'playing') {
                if (selectedIndex === targetIndex) {
                    playCorrect();
                    showResult(true, "");
                } else {
                    playIncorrect();
                    lives--;
                    livesDisplay.innerText = '❤️ ' + lives;
                    cardsGrid.classList.add('shake-anim');
                    setTimeout(() => cardsGrid.classList.remove('shake-anim'), 400);
                    showResult(false, `La respuesta correcta era "${sessionLevels[currentLevel].en}".`);
                }
            } else {
                nextLevel();
            }
        };

        function showResult(isWin, msg) {
            btnGroupLeft.style.display = 'none';
            footerMsg.style.display = 'block';
            
            if (isWin) {
                gameState = 'checked-correct';
                footerBar.className = 'footer-bar correct';
                document.getElementById('msgTitle').innerText = '¡Impresionante!';
                document.getElementById('msgSub').innerText = 'Significado correcto';
                actionBtn.className = 'check-btn next';
                actionBtn.innerText = 'CONTINUAR';
            } else {
                gameState = 'checked-incorrect';
                footerBar.className = 'footer-bar incorrect';
                document.getElementById('msgTitle').innerText = 'Respuesta incorrecta';
                document.getElementById('msgSub').innerText = msg;
                actionBtn.className = 'check-btn next';
                actionBtn.innerText = 'ENTENDIDO';
                
                if (lives <= 0) setTimeout(() => { document.getElementById('loseScreen').style.display = 'flex'; }, 1000);
            }
        }

        function nextLevel() {
            if (gameState === 'checked-correct') currentLevel++;
            
            if (currentLevel >= sessionLevels.length && lives > 0) {
                progressBar.style.width = '100%';
                playCorrect(); setTimeout(()=>playCorrect(), 300);
                
                // GUARDAR PROGRESO AL GANAR
                localStorage.setItem('lingua_visual_wins', totalWins + 1);
                
                document.getElementById('winScreen').style.display = 'flex';
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
            } else if (lives > 0) {
                initLevel();
            }
        }

        // Keyboard hotkeys
        window.addEventListener('keydown', (e) => {
            if (gameState === 'playing' && ['1', '2', '3'].includes(e.key)) {
                handleSelect(parseInt(e.key) - 1);
            } else if (e.key === 'Enter') {
                if (!actionBtn.disabled) actionBtn.click();
            }
        });

        window.addEventListener('click', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, {once:true});
        initLevel();
    </script>
<script src="universe_bg.js"></script>
</body>
</html>
