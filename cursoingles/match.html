<!DOCTYPE html>
<html lang="es">
<head>
    <!-- INTEP: Session guard -->
    <script>
    (function(){
      fetch('/intep/cursoingles/api/sesion.php',{credentials:'include'})
        .then(function(r){return r.json();})
        .then(function(d){if(!d.ok)window.location.replace('/intep/login.php');window.__INTEP=d;})
        .catch(function(){window.location.replace('/intep/login.php');});
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Parejas | INTEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lesson.css">
    <style>
        body { 
            background: transparent; 
             
            margin: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        .game-header {
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .close-btn { color: #94a3b8; font-size: 2.5rem; text-decoration: none; font-weight: bold; transition: color 0.3s;}
        .close-btn:hover { color: white; }

        .game-area {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 2px 20px;
        }

        .game-title {
            color: white;
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-family: 'Outfit', sans-serif;
        }

        .level-badge {
            color: #facc15;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 25px;
            background: rgba(250, 204, 21, 0.15);
            width: max-content;
            margin-left: auto;
            margin-right: auto;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .match-btn {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-bottom: 6px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
            word-wrap: break-word;
        }

        .match-btn:active { transform: translateY(4px); border-bottom-width: 2px; margin-top: 4px; }
        .match-btn:hover { background: rgba(255,255,255,0.1); }
        .match-btn.selected { background: rgba(99, 102, 241, 0.2); border-color: #818cf8; border-bottom-color: #6366f1; }
        .match-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: #34d399; border-bottom-color: #10b981; pointer-events: none; animation: popOut 0.5s ease forwards; }
        .match-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: #f87171; border-bottom-color: #ef4444; animation: shake 0.4s; }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; display: none; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Overlay Win Screen */
        .overlay-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="dashboard.html" class="close-btn">×</a>
        <div style="color: white; font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px;" id="timerDisplay">⏳ 00:00</div>
    </div>

    <div class="game-area">
        <h1 class="game-title">Empareja las palabras</h1>
        <div class="level-badge" id="levelDisplay">Nivel: Calculando...</div>
        
        <div class="match-grid">
            <div class="match-column" id="colLeft"></div>
            <div class="match-column" id="colRight"></div>
        </div>
    </div>

    <div class="overlay-screen" id="winScreen">
        <h1 style="font-size: 6rem; margin-bottom: 20px;">⚡🏆⚡</h1>
        <h2 style="color: white; font-size: 4rem;">¡Despejado!</h2>
        <p style="color: #94a3b8; font-size: 1.5rem; margin-bottom: 20px;">Nivel Superado. Tiempo: <span id="finalTime" style="color: #10b981; font-weight:bold;">0s</span></p>
        <p style="color: #facc15; font-size: 1.2rem; margin-bottom: 40px; font-style: italic;">¡La próxima vez será más difícil!</p>
        
        <div style="display: flex; gap: 20px;">
            <button onclick="location.reload()" class="match-btn" style="background:#6366f1; color:white; border-color:#4f46e5; border-bottom: 8px solid #4338ca; padding: 20px 40px; font-size: 1.2rem;">JUGAR DE NUEVO</button>
            <a href="dashboard.html" class="match-btn" style="display:inline-block; text-decoration:none; background:#10b981; color:white; border-color:#059669; border-bottom: 8px solid #047857; padding: 20px 40px; font-size: 1.2rem;">VOLVER</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Massive dynamic dictionary based on wins
        const dictionary = {
            1: [ // Easy
                { id:1, es: "Película", en: "Movie" }, { id:2, es: "Perro", en: "Dog" }, { id:3, es: "Gato", en: "Cat" }, { id:4, es: "Música", en: "Music" }, { id:5, es: "Agua", en: "Water" },
                { id:6, es: "Casa", en: "House" }, { id:7, es: "Libro", en: "Book" }, { id:8, es: "Feliz", en: "Happy" }, { id:9, es: "Coche", en: "Car" }, { id:10, es: "Comida", en: "Food" },
                { id:11, es: "Amigo", en: "Friend" }, { id:12, es: "Familia", en: "Family" }, { id:13, es: "Sol", en: "Sun" }, { id:14, es: "Dinero", en: "Money" }, { id:15, es: "Escuela", en: "School" }
            ],
            2: [ // Medium
                { id:16, es: "Desarrollo", en: "Development" }, { id:17, es: "Entender", en: "Understand" }, { id:18, es: "Siempre", en: "Always" }, { id:19, es: "Pensar", en: "Think" },
                { id:20, es: "Porque", en: "Because" }, { id:21, es: "Conocimiento", en: "Knowledge" }, { id:22, es: "Mejorar", en: "Improve" }, { id:23, es: "Salud", en: "Health" },
                { id:24, es: "Comprar", en: "Buy" }, { id:25, es: "Encontrar", en: "Find" }, { id:26, es: "Diferente", en: "Different" }, { id:27, es: "Preguntar", en: "Ask" },
                { id:28, es: "Aprender", en: "Learn" }, { id:29, es: "Cambiante", en: "Changing" }, { id:30, es: "Ayer", en: "Yesterday" }, { id:31, es: "Problema", en: "Problem" }
            ],
            3: [ // Hard
                { id:32, es: "Rendirse", en: "Give up" }, { id:33, es: "Averiguar", en: "Find out" }, { id:34, es: "A pesar de", en: "Despite" }, { id:35, es: "Impresionante", en: "Awesome" },
                { id:36, es: "Logro", en: "Achievement" }, { id:37, es: "Desafío", en: "Challenge" }, { id:38, es: "De repente", en: "Suddenly" }, { id:39, es: "Propósito", en: "Purpose" },
                { id:40, es: "Superar", en: "Overcome" }, { id:41, es: "Ansiosamente", en: "Eagerly" }, { id:42, es: "Sin embargo", en: "However" }, { id:43, es: "Conciencia", en: "Awareness" }, 
                { id:44, es: "Confiable", en: "Reliable" }, { id:45, es: "Abrumador", en: "Overwhelming" }, { id:46, es: "Amenaza", en: "Threat" }, { id:47, es: "Exitoso", en: "Successful" }
            ]
        };

        // Get Wins for difficulty progression
        let totalWins = parseInt(localStorage.getItem('lingua_match_wins')) || 0;
        
        let difficulty = 1;
        let numPairs = 5; // Start with 5 pairs
        let levelName = "Básico";

        if (totalWins >= 3 && totalWins < 7) {
            difficulty = 2; numPairs = 6; levelName = "Intermedio";
        } else if (totalWins >= 7) {
            difficulty = 3; numPairs = 7; levelName = "Avanzado 💀";
        }
        
        document.getElementById('levelDisplay').innerText = `Sesiones Ganadas: ${totalWins} | Dificultad: ${levelName}`;

        let gameVocab = [...dictionary[difficulty]].sort(() => Math.random() - 0.5).slice(0, numPairs);

        let leftSelected = null;
        let rightSelected = null;
        let pairsMatched = 0;
        let startTime = Date.now();
        let timerInterval;

        const colLeft = document.getElementById('colLeft');
        const colRight = document.getElementById('colRight');

        // Sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        function playTap() { playTone(500, 'sine', 0.1); }
        function playCorrect() { playTone(800, 'sine', 0.1); setTimeout(()=>playTone(1000, 'sine', 0.15), 100); }
        function playIncorrect() { playTone(150, 'sawtooth', 0.3); }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            return `⏳ ${Math.floor(totalSeconds / 60).toString().padStart(2, '0')}:${(totalSeconds % 60).toString().padStart(2, '0')}`;
        }

        function initGame() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                document.getElementById('timerDisplay').innerText = formatTime(Date.now() - startTime);
            }, 1000);

            // Shuffling arrays
            let leftItems = gameVocab.map(p => ({ id: p.id, text: p.es, side: 'left' })).sort(() => Math.random() - 0.5);
            let rightItems = gameVocab.map(p => ({ id: p.id, text: p.en, side: 'right' })).sort(() => Math.random() - 0.5);

            leftItems.forEach(item => {
                let btn = document.createElement('button');
                btn.className = 'match-btn';
                btn.innerText = item.text;
                btn.onclick = () => handleSelect(btn, item);
                colLeft.appendChild(btn);
            });

            rightItems.forEach(item => {
                let btn = document.createElement('button');
                btn.className = 'match-btn';
                btn.innerText = item.text;
                btn.onclick = () => handleSelect(btn, item);
                colRight.appendChild(btn);
            });
        }

        function handleSelect(btn, item) {
            playTap();
            if (item.side === 'left') {
                if (leftSelected && leftSelected.btn === btn) { btn.classList.remove('selected'); leftSelected = null; return; }
                if (leftSelected) leftSelected.btn.classList.remove('selected');
                leftSelected = { btn, item }; btn.classList.add('selected');
            } else {
                if (rightSelected && rightSelected.btn === btn) { btn.classList.remove('selected'); rightSelected = null; return; }
                if (rightSelected) rightSelected.btn.classList.remove('selected');
                rightSelected = { btn, item }; btn.classList.add('selected');
            }
            if (leftSelected && rightSelected) checkMatch();
        }

        function checkMatch() {
            let left = leftSelected;
            let right = rightSelected;
            
            document.querySelectorAll('.match-grid .match-btn').forEach(b => b.style.pointerEvents = 'none');
            
            if (left.item.id === right.item.id) {
                playCorrect();
                left.btn.classList.add('correct'); right.btn.classList.add('correct');
                pairsMatched++;
                
                if (pairsMatched === gameVocab.length) {
                    clearInterval(timerInterval);
                    // Add win to localStorage for progression
                    localStorage.setItem('lingua_match_wins', totalWins + 1);
                    
                    setTimeout(() => {
                        const totalTime = Math.floor((Date.now() - startTime) / 1000);
                        document.getElementById('finalTime').innerText = totalTime + 's';
                        document.getElementById('winScreen').style.display = 'flex';
                        confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
                    }, 500);
                } else {
                    document.querySelectorAll('.match-grid .match-btn:not(.correct)').forEach(b => b.style.pointerEvents = 'auto');
                }
            } else {
                playIncorrect();
                left.btn.classList.add('incorrect'); right.btn.classList.add('incorrect');
                setTimeout(() => {
                    left.btn.classList.remove('incorrect', 'selected'); right.btn.classList.remove('incorrect', 'selected');
                    document.querySelectorAll('.match-grid .match-btn:not(.correct)').forEach(b => b.style.pointerEvents = 'auto');
                }, 400);
            }
            leftSelected = null; rightSelected = null;
        }

        window.addEventListener('click', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, {once:true});
        initGame();
    </script>
<script src="universe_bg.js"></script>
</body>
</html>
