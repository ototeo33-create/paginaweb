<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)"/>
            <stop offset="60%" stop-color="rgba(15, 23, 42, 0.9)"/>
            <stop offset="100%" stop-color="#050810"/>
        </radialGradient>
        <radialGradient id="pinkGlow" cx="80%" cy="20%" r="40%">
            <stop offset="0%" stop-color="rgba(236, 72, 153, 0.25)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
        <radialGradient id="goldGlow" cx="20%" cy="80%" r="40%">
            <stop offset="0%" stop-color="rgba(234, 179, 8, 0.15)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
    </defs>
    
    <!-- Cosmos base -->
    <rect width="100%" height="100%" fill="url(#nebula)" />
    <rect width="100%" height="100%" fill="url(#pinkGlow)" />
    <rect width="100%" height="100%" fill="url(#goldGlow)" />

    <!-- Stars with different blinking ratios -->
    <g fill="white">
        <!-- Static micro stars -->
        <circle cx="10%" cy="20%" r="1" opacity="0.8"/>
        <circle cx="45%" cy="15%" r="1" opacity="0.9"/>
        <circle cx="70%" cy="85%" r="1.5" opacity="0.7"/>
        <circle cx="90%" cy="60%" r="1" opacity="0.6"/>
        <circle cx="55%" cy="40%" r="1" opacity="0.5"/>
        <circle cx="85%" cy="90%" r="1.5" opacity="0.8"/>
        <circle cx="5%" cy="60%" r="0.5" opacity="0.7"/>
        <circle cx="15%" cy="80%" r="1" opacity="0.6"/>
        
        <!-- Blinking stars -->
        <circle cx="25%" cy="80%" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
        <circle cx="85%" cy="30%" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="15%" cy="50%" r="2.5"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/></circle>
        <circle cx="75%" cy="10%" r="2"><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="40%" cy="70%" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Detailed Constellation (The Big Dipper style) -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
        <line x1="20%" y1="30%" x2="25%" y2="35%" />
        <line x1="25%" y1="35%" x2="30%" y2="32%" />
        <line x1="30%" y1="32%" x2="33%" y2="40%" />
        <line x1="33%" y1="40%" x2="38%" y2="42%" />
        <line x1="38%" y1="42%" x2="42%" y2="36%" />
        <line x1="42%" y1="36%" x2="30%" y2="32%" />
    </g>
    <!-- Constellation Stars -->
    <g fill="#e2e8f0">
        <circle cx="20%" cy="30%" r="3"><animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="25%" cy="35%" r="3"/>
        <circle cx="30%" cy="32%" r="3"/>
        <circle cx="33%" cy="40%" r="3"/>
        <circle cx="38%" cy="42%" r="3"/>
        <circle cx="42%" cy="36%" r="3"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Planet 1 (Saturn inspired) -->
    <g transform="translate(1300, 200) rotate(-20) scale(0.6)" opacity="0.8">
        <!-- Body -->
        <circle cx="0" cy="0" r="50" fill="#ec4899" />
        <path d="M -50 0 A 50 50 0 0 0 50 0" fill="rgba(0,0,0,0.2)" />
        <path d="M -30 -30 Q 0 -40 30 -30" stroke="#fce7f3" stroke-width="4" fill="none" opacity="0.6"/>
        
        <!-- Rings -->
        <ellipse cx="0" cy="0" rx="90" ry="15" fill="none" stroke="rgba(252, 231, 243, 0.8)" stroke-width="8" />
        <ellipse cx="0" cy="0" rx="110" ry="5" fill="none" stroke="rgba(252, 231, 243, 0.4)" stroke-width="3" />
        <path d="M -90 0 A 90 15 0 0 1 90 0" stroke="#ec4899" stroke-width="8" fill="none" opacity="0.5"/> <!-- Overlap fix for 3D illusion -->
    </g>

    <!-- Planet 2 (Jupiter/Gas giant inspired) -->
    <g transform="translate(150, 750) scale(0.8)" opacity="0.6">
        <circle cx="0" cy="0" r="80" fill="#eab308" />
        <!-- Shadow -->
        <path d="M -80 0 A 80 80 0 0 0 80 0" fill="rgba(0,0,0,0.3)" />
        <!-- planet stripes -->
        <path d="M -75 -20 Q 0 -10 75 -20" stroke="rgba(0,0,0,0.2)" stroke-width="15" fill="none" />
        <path d="M -75 20 Q 0 30 75 20" stroke="rgba(0,0,0,0.1)" stroke-width="20" fill="none" />
        <path d="M -60 45 Q 0 55 60 45" stroke="rgba(255,255,255,0.15)" stroke-width="8" fill="none" />
        <!-- planet spot -->
        <circle cx="-30" cy="-5" r="15" fill="rgba(0,0,0,0.25)" />
    </g>

    <g transform="translate(1000, 800) scale(0.3)" opacity="0.4">
        <circle cx="0" cy="0" r="40" fill="#06b6d4" />
        <circle cx="10" cy="-10" r="15" fill="rgba(255,255,255,0.2)" />
    </g>

    <!-- UFO was moved to the DOM for interactivity -->
    
    <!-- Shooting star -->
    <g opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="-500,-500; 2500,2500" dur="15s" repeatCount="indefinite" />
        <line x1="0" y1="0" x2="-60" y2="-60" stroke="url(#pinkGlow)" stroke-width="2" />
        <circle cx="0" cy="0" r="2" fill="white" />
    </g>
</svg>
